esphome:
  name: esphome-kids-mp3-player
  friendly_name: ESPHome_Kids_MP3_Player

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "mT7tM3BLJVqEH98+g2M5HHnuwkhzPwoUN6wm5auj86A="

ota:
  - platform: esphome
    password: "e8a80a78e726399ed6d6c1c6ab63bd01"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esphome-Kids-Mp3-Player"
    password: !secret wifi_captive_portal_password

captive_portal:

# Example configuration entry
web_server:
  port: 80

# UART pro DFPlayer (typicky UART2 na ESP32)
uart:
  id: df_uart
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

dfplayer:
  id: player
  uart_id: df_uart

# Uložíme si vybraný track (1..150)
globals:
  - id: selected_track
    type: int
    restore_value: true
    initial_value: '1'

