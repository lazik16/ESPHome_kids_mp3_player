# Tlačítka
button:
  - platform: template
    name: "Play"
    icon: mdi:play
    on_press:
      then:
        # Přehrát skladbu v /mp3 jako číslo 1..150
        - dfplayer.play_mp3:
            file: !lambda "return id(selected_track);"
  - platform: template
    name: "Stop"
    icon: mdi:stop
    on_press:
      then:
        - dfplayer.stop

  - platform: template
    name: "Next"
    icon: mdi:skip-next
    on_press:
      then:
        - dfplayer.play_next

  - platform: template
    name: "Prev"
    icon: mdi:skip-previous
    on_press:
      then:
        - dfplayer.play_previous

# Volume jako slider v HA (0..30)
number:
  - platform: template
    name: "Hlasitost"
    id: df_volume
    min_value: 0
    max_value: 30
    step: 1
    optimistic: true
    restore_value: true
    mode: slider
    on_value:
      then:
        - dfplayer.set_volume: !lambda "return (int) x;"
